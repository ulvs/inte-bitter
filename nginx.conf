server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Hashed CRA bundles never change, so cache them for a year.
    location /static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Always revalidate the page so new deploys show up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # No client-side routing: unknown paths are real 404s.
    location / {
        try_files $uri $uri/ =404;
    }
}
